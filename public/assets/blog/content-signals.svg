<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Content signals lead to creator candidates</title><desc id="desc">Editorial diagram connecting product problems, content formats and audience context to a creator shortlist.</desc>
  <rect width="1600" height="900" fill="#0b1831"/><path d="M0 690C310 590 480 750 780 650s520-60 820-210v460H0Z" fill="#10254b"/>
  <text x="90" y="110" fill="#6da4ff" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="5">QUICKKOL / CREATOR DISCOVERY</text>
  <text x="90" y="205" fill="#f7f8fc" font-family="Arial,sans-serif" font-size="72" font-weight="800">SEARCH THE CONTENT.</text>
  <text x="90" y="275" fill="#f7f8fc" font-family="Arial,sans-serif" font-size="72" font-weight="800">VERIFY THE CREATOR.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(90 380)"><rect width="350" height="280" rx="28" fill="#fff7ec"/><text x="34" y="55" fill="#0b1831" font-size="20" font-weight="700">01 / PROBLEM</text><text x="34" y="118" fill="#0b1831" font-size="34" font-weight="800">Product use case</text><text x="34" y="180" fill="#61708a" font-size="23">Questions · needs · jobs</text><circle cx="300" cy="226" r="24" fill="#ff765f"/></g>
  <g transform="translate(505 380)"><rect width="350" height="280" rx="28" fill="#eaf2ff"/><text x="34" y="55" fill="#0b1831" font-size="20" font-weight="700">02 / FORMAT</text><text x="34" y="118" fill="#0b1831" font-size="34" font-weight="800">Comparable content</text><text x="34" y="180" fill="#61708a" font-size="23">Reviews · demos · guides</text><circle cx="300" cy="226" r="24" fill="#2d7ff9"/></g>
  <g transform="translate(920 380)"><rect width="350" height="280" rx="28" fill="#f4efff"/><text x="34" y="55" fill="#0b1831" font-size="20" font-weight="700">03 / AUDIENCE</text><text x="34" y="118" fill="#0b1831" font-size="34" font-weight="800">Market context</text><text x="34" y="180" fill="#61708a" font-size="23">Language · comments · proof</text><circle cx="300" cy="226" r="24" fill="#9a7cff"/></g>
  <path d="M1270 520h120" stroke="#6da4ff" stroke-width="8" stroke-linecap="round"/><path d="m1360 490 45 30-45 30" fill="none" stroke="#6da4ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="1400" y="410" width="125" height="220" rx="62" fill="#2d7ff9"/><text x="1462" y="500" fill="white" font-size="22" font-weight="700" text-anchor="middle">SHORT</text><text x="1462" y="535" fill="white" font-size="22" font-weight="700" text-anchor="middle">LIST</text></g>
  <text x="90" y="805" fill="#9eabc0" font-family="Arial,sans-serif" font-size="24">Search signals create a pool. Recent content supplies the evidence.</text>
</svg>
