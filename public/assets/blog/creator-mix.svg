<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mix the jobs</title><desc id="desc">An editorial creator portfolio cover with tier rings and role labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#0d1c35"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M0 720C330 590 520 840 820 690s490-70 780-220v430H0z" fill="#102443"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#f6f2e9">
