    <text x="90" y="225" font-size="112" font-weight="900" letter-spacing="-5">MIX THE</text>
    <text x="90" y="335" font-size="112" font-weight="900" letter-spacing="-5" fill="#2f86ff">JOBS.</text>
    <text x="96" y="390" font-size="25" fill="#aebbd0">ROLE BEFORE REACH · SCOPE BEFORE SCALE</text>
  </g>
  <g transform="translate(770 92)" filter="url(#shadow)" font-family="Arial,Helvetica,sans-serif">
    <circle cx="350" cy="350" r="310" fill="#f6f2e9"/>
    <circle cx="350" cy="350" r="247" fill="none" stroke="#d8d9d7" stroke-width="2"/>
    <circle cx="350" cy="350" r="178" fill="none" stroke="#2f86ff" stroke-width="64" stroke-dasharray="620 498" transform="rotate(-70 350 350)"/>
    <circle cx="350" cy="350" r="95" fill="#0b1528"/>
    <path d="M350 40v620M40 350h620" stroke="#0b1528" stroke-opacity=".13"/>
    <circle cx="492" cy="242" r="42" fill="#ff765d"/>
    <circle cx="208" cy="475" r="30" fill="#2f86ff"/>
    <text x="350" y="338" text-anchor="middle" font-size="25" font-weight="700" fill="#7aaeff">ONE PLAN</text>
    <text x="350" y="383" text-anchor="middle" font-size="39" font-weight="900" fill="#f6f2e9">3 ROLES</text>
