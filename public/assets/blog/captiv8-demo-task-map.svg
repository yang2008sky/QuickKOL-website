<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="900" height="600" rx="0" fill="#F5F1E8" /><text x="40" y="68" font-size="28" fill="#191919" font-weight="600" >用任务验证演示 / EVALUATE THE DEMO THROUGH WORK</text><rect x="40" y="120" width="820" height="120" rx="12" fill="#FFFFFF" /><rect x="40" y="120" width="12" height="120" rx="0" fill="#2358EE" /><text x="70" y="168" font-size="34" fill="#191919" font-weight="600" >发现</text><text x="70" y="211" font-size="25" fill="#191919" font-weight="500" >Discovery</text><text x="425" y="168" font-size="33" fill="#191919" font-weight="600" >为什么是这些人？</text><text x="425" y="211" font-size="25" fill="#191919" font-weight="500" >Why these creators?</text><rect x="40" y="265" width="820" height="120" rx="12" fill="#FFFFFF" /><rect x="40" y="265" width="12" height="120" rx="0" fill="#F4795D" /><text x="70" y="313" font-size="34" fill="#191919" font-weight="600" >执行</text><text x="70" y="356" font-size="25" fill="#191919" font-weight="500" >Execution</text><text x="425" y="313" font-size="33" fill="#191919" font-weight="600" >谁负责下一步？</text><text x="425" y="356" font-size="25" fill="#191919" font-weight="500" >Who owns the next step?</text><rect x="40" y="410" width="820" height="120" rx="12" fill="#FFFFFF" /><rect x="40" y="410" width="12" height="120" rx="0" fill="#191919" /><text x="70" y="458" font-size="34" fill="#191919" font-weight="600" >衡量</text><text x="70" y="501" font-size="25" fill="#191919" font-weight="500" >Measurement</text><text x="425" y="458" font-size="33" fill="#191919" font-weight="600" >数据能说明什么？</text><text x="425" y="501" font-size="25" fill="#191919" font-weight="500" >What can the data show?</text></svg>