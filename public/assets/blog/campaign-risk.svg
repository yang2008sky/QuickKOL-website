<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Creator campaign risk register</title><desc id="desc">Editorial risk cards connect triggers, owners and contingency actions.</desc>
  <rect width="1600" height="900" fill="#0c1931"/><circle cx="1420" cy="90" r="310" fill="#17345e"/><text x="90" y="110" fill="#ff9a69" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">QUICKKOL / CAMPAIGN OPERATIONS</text>
  <text x="90" y="215" fill="#fff" font-family="Arial,sans-serif" font-size="74" font-weight="800">PLAN THE DECISION.</text><text x="90" y="282" fill="#9eadc3" font-family="Arial,sans-serif" font-size="26">A useful risk has a trigger, an owner and a response.</text>
  <g font-family="Arial,sans-serif"><g transform="translate(90 390)"><rect width="430" height="310" rx="30" fill="#fff7ec"/><circle cx="54" cy="56" r="17" fill="#ff765f"/><text x="90" y="65" fill="#0c1931" font-size="25" font-weight="800">TRIGGER</text><text x="38" y="140" fill="#0c1931" font-size="31" font-weight="800">48 hours before</text><text x="38" y="184" fill="#0c1931" font-size="31" font-weight="800">rough cut</text><text x="38" y="252" fill="#66738a" font-size="21">Product still unavailable</text></g>
  <path d="M535 545h105" stroke="#ff9a69" stroke-width="7"/><path d="m620 520 32 25-32 25" fill="none" stroke="#ff9a69" stroke-width="7"/>
  <g transform="translate(660 390)"><rect width="350" height="310" rx="30" fill="#eaf2ff"/><text x="38" y="65" fill="#2d7ff9" font-size="21" font-weight="800">OWNER</text><text x="38" y="150" fill="#0c1931" font-size="36" font-weight="800">Campaign</text><text x="38" y="198" fill="#0c1931" font-size="36" font-weight="800">Lead</text><text x="38" y="252" fill="#66738a" font-size="21">Decision by 14:00</text></g>
  <path d="M1025 545h105" stroke="#ff9a69" stroke-width="7"/><path d="m1110 520 32 25-32 25" fill="none" stroke="#ff9a69" stroke-width="7"/>
  <g transform="translate(1150 390)"><rect width="360" height="310" rx="30" fill="#fff"/><text x="38" y="65" fill="#ff765f" font-size="21" font-weight="800">RESPONSE</text><text x="38" y="145" fill="#0c1931" font-size="34" font-weight="800">Activate local</text><text x="38" y="190" fill="#0c1931" font-size="34" font-weight="800">backup stock</text><text x="38" y="252" fill="#66738a" font-size="21">Cost and timing visible</text></g></g>
  <text x="90" y="815" fill="#9eadc3" font-family="Arial,sans-serif" font-size="23">Likelihood × impact prioritizes attention. Compliance can still block.</text>
</svg>
