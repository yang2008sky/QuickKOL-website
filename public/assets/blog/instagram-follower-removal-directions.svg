<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540"><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="900" height="540" rx="0" fill="#f6f1e7"/><text x="36" y="60" font-size="36" fill="#17191c" font-weight="600">先看关系方向</text><text x="36" y="104" font-size="27" fill="#17191c" font-weight="500">CHECK THE RELATIONSHIP DIRECTION</text><rect x="35" y="150" width="830" height="135" rx="12" fill="#fff"/><text x="60" y="202" font-size="33" fill="#17191c" font-weight="600">对方 → 你</text><text x="60" y="246" font-size="26" fill="#17191c" font-weight="500">They follow you</text><text x="490" y="202" font-size="33" fill="#2455ef" font-weight="600">移除粉丝</text><text x="490" y="246" font-size="26" fill="#2455ef" font-weight="500">Remove follower</text><rect x="35" y="330" width="830" height="135" rx="12" fill="#f47d61"/><text x="60" y="382" font-size="33" fill="#17191c" font-weight="600">你 → 对方</text><text x="60" y="426" font-size="26" fill="#17191c" font-weight="500">You follow them</text><text x="490" y="382" font-size="33" fill="#17191c" font-weight="600">取消关注</text><text x="490" y="426" font-size="26" fill="#17191c" font-weight="500">Unfollow</text></svg>