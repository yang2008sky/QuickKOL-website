<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="900" height="620" rx="0" fill="#f6f1e7"/><text x="36" y="60" font-size="36" fill="#17191c" font-weight="600">让作品和目标页面保持一致</text><text x="36" y="104" font-size="27" fill="#17191c" font-weight="500">CONNECT THE WORK TO THE RIGHT DESTINATION</text><rect x="35" y="155" width="395" height="160" rx="12" fill="#fff"/><text x="59" y="195" font-size="24" fill="#2455ef" font-weight="600">01</text><text x="59" y="257" font-size="33" fill="#17191c" font-weight="600">主体</text><text x="59" y="301" font-size="26" fill="#17191c" font-weight="500">Identity</text><rect x="470" y="155" width="395" height="160" rx="12" fill="#fff"/><text x="494" y="195" font-size="24" fill="#2455ef" font-weight="600">02</text><text x="494" y="257" font-size="33" fill="#17191c" font-weight="600">作品许可</text><text x="494" y="301" font-size="26" fill="#17191c" font-weight="500">Asset permission</text><rect x="35" y="375" width="395" height="160" rx="12" fill="#fff"/><text x="59" y="415" font-size="24" fill="#2455ef" font-weight="600">03</text><text x="59" y="477" font-size="33" fill="#17191c" font-weight="600">Pin 内容</text><text x="59" y="521" font-size="26" fill="#17191c" font-weight="500">Pin content</text><rect x="470" y="375" width="395" height="160" rx="12" fill="#2455ef"/><text x="494" y="415" font-size="24" fill="#fff" font-weight="600">04</text><text x="494" y="477" font-size="33" fill="#fff" font-weight="600">目标页面</text><text x="494" y="521" font-size="26" fill="#fff" font-weight="500">Destination</text></svg>