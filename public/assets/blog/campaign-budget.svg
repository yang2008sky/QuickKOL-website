<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Budget the whole scope</title><desc id="desc">A dark editorial campaign budget cover with layered cost bands.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070c15"/><stop offset="1" stop-color="#142443"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g transform="translate(85 76)" font-family="Arial,Helvetica,sans-serif">
    <text x="0" y="32" font-size="25" font-weight="800" letter-spacing="8" fill="#64a0ff">CAMPAIGN PLANNING</text>
    <text x="0" y="165" font-size="106" font-weight="900" letter-spacing="-5" fill="#f6f2e9">BUDGET THE</text>
    <text x="0" y="275" font-size="106" font-weight="900" letter-spacing="-5" fill="#f6f2e9">WHOLE SCOPE.</text>
    <text x="5" y="330" font-size="25" fill="#9eabc0">SEVEN COST LAYERS · THREE EXECUTABLE SCENARIOS</text>
    <g transform="translate(0 410)">
      <rect width="870" height="215" rx="28" fill="#f6f2e9"/>
      <rect x="30" y="43" width="340" height="55" rx="12" fill="#247af2"/>
      <rect x="380" y="43" width="170" height="55" rx="12" fill="#6ba5ff"/>
      <rect x="560" y="43" width="115" height="55" rx="12" fill="#ff765d"/>
      <rect x="685" y="43" width="155" height="55" rx="12" fill="#101827"/>
      <g fill="#101827" font-size="19" font-weight="800" letter-spacing="2">
        <text x="30" y="145">CREATION</text><text x="380" y="145">RIGHTS</text><text x="560" y="145">MEDIA</text><text x="685" y="145">OPS</text>
      </g>
      <text x="30" y="184" font-size="17" fill="#70798a">COMMITMENT + CONTINGENCY = PLAN</text>
    </g>
    <g transform="translate(930 395)">
      <rect width="485" height="335" rx="32" fill="#247af2"/>
      <text x="38" y="64" font-size="21" font-weight="800" letter-spacing="5" fill="#dfeaff">SCENARIO BALANCE</text>
      <text x="36" y="180" font-size="104" font-weight="900" fill="#fff">20%</text>
      <text x="39" y="225" font-size="25" font-weight="700" fill="#dfeaff">CHANGE THE SCOPE</text>
      <rect x="38" y="260" width="300" height="18" rx="9" fill="#102446"/>
      <rect x="38" y="260" width="215" height="18" rx="9" fill="#ff765d"/>
    </g>
    <circle cx="842" cy="43" r="22" fill="#ff765d"/><circle cx="904" cy="43" r="22" fill="#247af2"/><circle cx="966" cy="43" r="22" fill="#f6f2e9"/>
  </g>
</svg>
