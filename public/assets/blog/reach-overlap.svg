<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Creator audience overlap and unique reach</title><desc id="desc">Two overlapping creator audience circles with a combined reach formula.</desc>
  <rect width="1600" height="900" fill="#f4f0e8"/><rect x="55" y="55" width="1490" height="790" rx="34" fill="#fff" stroke="#0b1831" stroke-width="3"/>
  <text x="100" y="125" fill="#2d7ff9" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">QUICKKOL DATA DICTIONARY</text>
  <text x="100" y="225" fill="#0b1831" font-family="Arial,sans-serif" font-size="68" font-weight="800">COUNT PEOPLE ONCE.</text>
  <text x="100" y="285" fill="#68748b" font-family="Arial,sans-serif" font-size="25">Unique reach = Audience A + Audience B − Overlap</text>
  <g transform="translate(120 355)"><circle cx="330" cy="215" r="205" fill="#2d7ff9" fill-opacity=".83"/><circle cx="590" cy="215" r="205" fill="#ff765f" fill-opacity=".8"/><text x="225" y="190" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="800">CREATOR A</text><text x="640" y="190" fill="white" font-family="Arial,sans-serif" font-size="30" font-weight="800">CREATOR B</text><text x="460" y="225" fill="#0b1831" font-family="Arial,sans-serif" font-size="26" font-weight="800" text-anchor="middle">OVERLAP</text><text x="460" y="260" fill="#0b1831" font-family="Arial,sans-serif" font-size="20" text-anchor="middle">subtract once</text></g>
  <g transform="translate(1020 380)" font-family="Arial,sans-serif"><rect width="430" height="330" rx="28" fill="#0b1831"/><text x="40" y="65" fill="#8db8ff" font-size="20" font-weight="700">PLANNING OUTPUT</text><text x="40" y="145" fill="white" font-size="56" font-weight="800">120,000</text><text x="40" y="185" fill="#a7b3c6" font-size="22">combined unique reach</text><line x1="40" y1="225" x2="390" y2="225" stroke="#35445e"/><text x="40" y="285" fill="#6da4ff" font-size="42" font-weight="800">1.50×</text><text x="175" y="282" fill="#a7b3c6" font-size="21">average frequency</text></g>
  <text x="100" y="795" fill="#68748b" font-family="Arial,sans-serif" font-size="23">Model multiple overlap scenarios. Calibrate with post-launch evidence.</text>
</svg>
