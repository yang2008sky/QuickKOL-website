<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="900" height="620" rx="0" fill="#f6f1e7"/><text x="36" y="60" font-size="36" fill="#17191c" font-weight="600">从申请到付款，逐步确认状态</text><text x="36" y="104" font-size="27" fill="#17191c" font-weight="500">FROM APPLICATION TO PAYMENT</text><rect x="35" y="140" width="830" height="115" rx="12" fill="#fff"/><text x="60" y="186" font-size="33" fill="#17191c" font-weight="600">申请</text><text x="60" y="230" font-size="26" fill="#17191c" font-weight="500">Apply</text><text x="470" y="186" font-size="33" fill="#17191c" font-weight="600">不等于已获批</text><text x="470" y="230" font-size="26" fill="#17191c" font-weight="500">Not yet approved</text><rect x="35" y="280" width="830" height="115" rx="12" fill="#2455ef"/><text x="60" y="326" font-size="33" fill="#fff" font-weight="600">有效交易</text><text x="60" y="370" font-size="26" fill="#fff" font-weight="500">Eligible transaction</text><text x="470" y="326" font-size="33" fill="#fff" font-weight="600">不等于最终佣金</text><text x="470" y="370" font-size="26" fill="#fff" font-weight="500">Not final commission</text><rect x="35" y="420" width="830" height="115" rx="12" fill="#fff"/><text x="60" y="466" font-size="33" fill="#17191c" font-weight="600">确认与付款</text><text x="60" y="510" font-size="26" fill="#17191c" font-weight="500">Validate and pay</text><text x="470" y="466" font-size="33" fill="#17191c" font-weight="600">按计划条款处理</text><text x="470" y="510" font-size="26" fill="#17191c" font-weight="500">Program terms apply</text></svg>