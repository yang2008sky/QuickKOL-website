<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="900" height="600" rx="0" fill="#F5F1E8" /><text x="40" y="66" font-size="28" fill="#191919" font-weight="600" >快捷回复仍需判断 / A SHORTCUT STILL NEEDS JUDGMENT</text><rect x="40" y="108" width="820" height="138" rx="18" fill="#FFFFFF" /><text x="68" y="157" font-size="38" fill="#2358EE" font-weight="600" >/pickup</text><text x="68" y="207" font-size="31" fill="#191919" font-weight="600" >拟回复：我先核对领取时间。</text><path d="M100 246l-26 28v-28" fill="#fff"/><rect x="40" y="295" width="390" height="180" rx="14" fill="#2358EE" /><text x="65" y="350" font-size="36" fill="#F5F1E8" font-weight="600" >发送前修改</text><text x="65" y="403" font-size="28" fill="#F5F1E8" font-weight="500" >Edit before sending</text><rect x="470" y="295" width="390" height="180" rx="14" fill="#F4795D" /><text x="495" y="350" font-size="34" fill="#191919" font-weight="600" >记录待核对事项</text><text x="495" y="403" font-size="27" fill="#191919" font-weight="500" >Keep the follow-up</text><text x="40" y="548" font-size="30" fill="#191919" font-weight="500" >具体日期和安排由真实商家确认。</text><text x="40" y="585" font-size="25" fill="#191919" font-weight="500" >The business confirms the actual date and arrangement.</text></svg>