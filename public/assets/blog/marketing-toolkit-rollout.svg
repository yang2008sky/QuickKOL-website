<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1280 720" role="img"><title>A toolkit opens in four stages with explicit team ownership</title><rect width="1280" height="720" fill="#e9b495"/><text x="60" y="50" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#14243c" font-weight="700">QUICKKOL / TOOL WORKFLOWS</text><text x="60" y="165" font-family="Arial,Helvetica,sans-serif" font-size="105" fill="#14243c" font-weight="700">ADOPT.</text><text x="60" y="273" font-family="Arial,Helvetica,sans-serif" font-size="94" fill="#ffffff" font-weight="700">THEN EXPAND.</text><g transform="translate(68 363)"><path d="M0 188h1060" stroke="#fff0df" stroke-width="5"/><g transform="translate(0 105)"><path d="M0 0h200v83H0Z" fill="#14243c"/><text x="18" y="41" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#ffffff" font-weight="700">DEFINE</text><circle cx="100" cy="-22" r="23" fill="#fff0df"/><text x="93" y="-14" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#14243c" font-weight="700">1</text></g><g transform="translate(290 68)"><path d="M0 0h200v120H0Z" fill="#14243c"/><text x="18" y="41" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#ffffff" font-weight="700">ACTIVATE</text><circle cx="100" cy="-22" r="23" fill="#fff0df"/><text x="93" y="-14" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#14243c" font-weight="700">2</text></g><g transform="translate(580 30)"><path d="M0 0h200v158H0Z" fill="#247df2"/><text x="18" y="41" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#ffffff" font-weight="700">VERIFY</text><circle cx="100" cy="-22" r="23" fill="#fff0df"/><text x="93" y="-14" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#14243c" font-weight="700">3</text></g><g transform="translate(870 -8)"><path d="M0 0h200v196H0Z" fill="#14243c"/><text x="18" y="41" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#ffffff" font-weight="700">EXPAND