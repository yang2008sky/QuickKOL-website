<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>QuickKOL editorial cover</title><desc>A dark incident-response cover with four colorful blocks for pause, preserve, decide and review.</desc><rect width="1280" height="720" fill="#17191d"/><text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#ff7467">QUICKKOL / CAMPAIGN OPERATIONS</text><text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#ffffff">PAUSE.<tspan x="60" dy="68">VERIFY. ACT.</tspan></text><g transform="translate(650 95)" font-family="Arial, Helvetica, sans-serif" font-weight="800"><rect width="520" height="520" rx="30" fill="#f4eee5"/><g><g transform="translate(20 20)"><rect width="230" height="230" rx="24" fill="#ff7467"/><text x="24" y="48" font-size="18">01</text><text x="115" y="135" text-anchor="middle" font-size="24">PAUSE</text></g><g transform="translate(270 20)"><rect width="230" height="230" rx="24" fill="#ffd15b"/><text x="24" y="48" font-size="18">02</text><text x="115" y="135" text-anchor="middle" font-size="24">PRESERVE</text></g><g transform="translate(20 270)"><rect width="230" height="230" rx="24" fill="#77adff"/><text x="24" y="48" font-size="18">03</text><text x="115" y="135" text-anchor="middle" font-size="24">DECIDE</text></g><g transform="translate(270 270)"><rect width="230" height="230" rx="24" fill="#8bdcbb"/><text x="24" y="48" font-size="18">04</text><text x="115" y="135" text-anchor="middle" font-size="24">REVIEW</text></g></g></g><text x="60" y="555" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#aeb7c4">FACTS BEFORE REACTION</text><text x="60" y="675" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#818a96">QUICKKOL STRATEGY TEAM</text></svg>