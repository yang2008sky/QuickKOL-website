<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Name the denominator</title><desc id="desc">A precise editorial data dictionary cover comparing two metric formulas.</desc>
  <defs><linearGradient id="b" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f5f0e7"/><stop offset="1" stop-color="#e9edf5"/></linearGradient></defs>
  <rect width="1600" height="900" fill="url(#b)"/>
  <rect x="70" y="65" width="1460" height="770" rx="36" fill="#fff" stroke="#111827" stroke-width="3"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="118" y="128" font-size="24" font-weight="800" letter-spacing="7" fill="#247af2">QUICKKOL DATA DICTIONARY</text>
    <text x="112" y="250" font-size="92" font-weight="900" letter-spacing="-4" fill="#101827">NAME THE</text>
    <text x="112" y="345" font-size="92" font-weight="900" letter-spacing="-4" fill="#101827">DENOMINATOR.</text>
    <line x1="115" y1="400" x2="1480" y2="400" stroke="#c6cad2" stroke-width="2"/>
    <g transform="translate(115 450)">
      <rect width="640" height="290" rx="25" fill="#0c172a"/>
      <text x="35" y="58" font-size="20" font-weight="700" letter-spacing="4" fill="#75aaff">FORMULA 01</text>
      <text x="35" y="142" font-size="55" font-weight="900" fill="#fff">INTERACTIONS</text>
      <line x1="35" y1="170" x2="500" y2="170" stroke="#ff765d" stroke-width="8"/>
      <text x="35" y="236" font-size="52" font-weight="900" fill="#fff">VIEWS</text>
      <circle cx="565" cy="215" r="45" fill="#ff765d"/>
      <text x="565" y="229" text-anchor="middle" font-size="34" font-weight="900" fill="#0c172a">%</text>
    </g>
    <g transform="translate(805 450)">
      <rect width="640" height="290" rx="25" fill="#eaf2ff" stroke="#247af2" stroke-width="3"/>
      <text x="35" y="58" font-size="20" font-weight="700" letter-spacing="4" fill="#247af2">FORMULA 02</text>
      <text x="35" y="142" font-size="55" font-weight="900" fill="#101827">INTERACTIONS</text>
      <line x1="35" y1="170" x2="500" y2="170" stroke="#247af2" stroke-width="8"/>
      <text x="35" y="236" font-size="52" font-weight="900" fill="#101827">FOLLOWERS</text>
      <circle cx="565" cy="215" r="45" fill="#247af2"/>
      <text x="565" y="229" text-anchor="middle" font-size="34" font-weight="900" fill="#fff">%</text>
    </g>
    <text x="115" y="795" font-size="23" font-weight="700" fill="#667085">SAME LABEL. DIFFERENT DECISION.</text>
  </g>
