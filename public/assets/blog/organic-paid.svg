<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img"><title>QuickKOL editorial cover</title><desc>A split light and dark cover separating organic creator publishing from paid amplification.</desc><rect width="1280" height="720" fill="#e9f1ff"/><text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#247df2">QUICKKOL / AUDIENCE + ANALYTICS</text><text x="60" y="150" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="#101828">SEPARATE THE<tspan x="60" dy="68">DELIVERY.</tspan></text><g transform="translate(700 90)" font-family="Arial, Helvetica, sans-serif" font-weight="800"><path d="M0 0h450v250H0z" fill="#ffffff" stroke="#2377ee" stroke-width="4"/><text x="225" y="70" text-anchor="middle" font-size="28">ORGANIC</text><circle cx="225" cy="150" r="58" fill="#90dfbf"/><path d="M0 290h450v250H0z" fill="#182c50"/><text x="225" y="360" text-anchor="middle" fill="white" font-size="28">PAID</text><g fill="#ff775f"><circle cx="140" cy="450" r="28"/><circle cx="225" cy="450" r="28"/><circle cx="310" cy="450" r="28"/></g></g><text x="60" y="550" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#52657e">ONE ASSET · TWO ENVIRONMENTS · TWO REPORTS</text><text x="60" y="675" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#667085">QUICKKOL STRATEGY TEAM</text></svg>