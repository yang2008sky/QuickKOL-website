<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="900" height="600" rx="0" fill="#F5F1E8" /><text x="40" y="64" font-size="31" fill="#191919" font-weight="600" >先看账号 / START WITH THE ACCOUNT</text><rect x="40" y="105" width="820" height="125" rx="12" fill="#FFFFFF" /><text x="65" y="157" font-size="34" fill="#191919" font-weight="600" >普通个人资料</text><text x="65" y="201" font-size="27" fill="#191919" font-weight="500" >Ordinary profile</text><text x="480" y="157" font-size="29" fill="#2358EE" font-weight="600" >免费认证：检查资格</text><text x="480" y="201" font-size="23" fill="#2358EE" font-weight="500" >Check free-route eligibility</text><rect x="40" y="250" width="820" height="125" rx="12" fill="#FFFFFF" /><text x="65" y="302" font-size="34" fill="#191919" font-weight="600" >专业模式</text><text x="65" y="346" font-size="27" fill="#191919" font-weight="500" >Professional mode</text><text x="480" y="302" font-size="29" fill="#2358EE" font-weight="600" >查看创作者订阅</text><text x="480" y="346" font-size="23" fill="#2358EE" font-weight="500" >Inspect the creator offer</text><rect x="40" y="395" width="820" height="125" rx="12" fill="#FFFFFF" /><text x="65" y="447" font-size="34" fill="#191919" font-weight="600" >公共主页</text><text x="65" y="491" font-size="27" fill="#191919" font-weight="500" >Page</text><text x="480" y="447" font-size="29" fill="#2358EE" font-weight="600" >查看商家适用路线</text><text x="480" y="491" font-size="23" fill="#2358EE" font-weight="500" >Check the business route</text><text x="40" y="571" font-size="24" fill="#191919" font-weight="500" >资格与地区另行确认 / CONFIRM ACCOUNT ELIGIBILITY</text></svg>