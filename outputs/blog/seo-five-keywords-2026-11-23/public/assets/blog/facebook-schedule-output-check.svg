<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540"><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="900" height="540" rx="0" fill="#F5F1E8" /><text x="40" y="70" font-size="29" fill="#191919" font-weight="600" >从创建到实际发布 / FROM CREATION TO PUBLICATION</text><rect x="40" y="120" width="220" height="180" rx="12" fill="#FFFFFF" /><text x="62" y="160" font-size="24" fill="#2358EE" font-weight="600" >1</text><text x="62" y="216" font-size="38" fill="#191919" font-weight="600" >创建</text><text x="62" y="265" font-size="30" fill="#191919" font-weight="500" >Create</text><rect x="340" y="120" width="220" height="180" rx="12" fill="#FFFFFF" /><text x="362" y="160" font-size="24" fill="#2358EE" font-weight="600" >2</text><text x="362" y="216" font-size="38" fill="#191919" font-weight="600" >预览</text><text x="362" y="265" font-size="30" fill="#191919" font-weight="500" >Preview</text><rect x="640" y="120" width="220" height="180" rx="12" fill="#FFFFFF" /><text x="662" y="160" font-size="24" fill="#2358EE" font-weight="600" >3</text><text x="662" y="216" font-size="38" fill="#191919" font-weight="600" >排期</text><text x="662" y="265" font-size="30" fill="#191919" font-weight="500" >Schedule</text><path d="M268 215 L330 215" stroke="#191919" stroke-width="3"/><path d="M321 207 L330 215 L321 223" fill="none" stroke="#191919" stroke-width="3"/><path d="M568 215 L630 215" stroke="#191919" stroke-width="3"/><path d="M621 207 L630 215 L621 223" fill="none" stroke="#191919" stroke-width="3"/><rect x="40" y="351" width="820" height="135" rx="12" fill="#2358EE" /><text x="67" y="402" font-size="34" fill="#F5F1E8" font-weight="600" >重新找到记录 → 到时查看实际帖子</text><text x="67" y="452" font-size="28" fill="#F5F1E8" font-weight="500" >Find the saved item → Check the live post</text></svg>