<svg xmlns="http://www.w3.org/2000/svg" width="1672" height="941" viewBox="0 0 1672 941" role="img"><title>TikTok Analytics: Separate Creative Review From Distribution</title><rect x="0" y="0" width="1672" height="941" rx="0" fill="#f6f2e9"/><rect x="0" y="0" width="1672" height="215" rx="0" fill="#141618"/><text x="105" y="145" font-family="Arial, Helvetica, sans-serif" font-size="80" font-weight="750" fill="#f6f2e9">THREE DIFFERENT QUESTIONS</text><circle cx="340" cy="495" r="185" fill="#244ce8"/><circle cx="835" cy="495" r="185" fill="#ff484a"/><circle cx="1330" cy="495" r="185" fill="#141618"/><text x="190" y="520" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="750" fill="#f6f2e9">CREATIVE</text><text x="666" y="520" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="750" fill="#141618">DISTRIBUTION</text><text x="1210" y="520" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="750" fill="#f6f2e9">ACTION</text><text x="110" y="840" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="750" fill="#141618">REVIEW EACH WITH ITS OWN EVIDENCE</text></svg>