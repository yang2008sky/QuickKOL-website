<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570"><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="900" height="570" rx="0" fill="#f6f1e7"/><text x="36" y="60" font-size="36" fill="#17191c" font-weight="600">服务主张与核验证据分开</text><text x="36" y="104" font-size="27" fill="#17191c" font-weight="500">CLAIMS AND EVIDENCE ARE DIFFERENT</text><rect x="35" y="145" width="395" height="275" rx="12" fill="#fff"/><text x="60" y="210" font-size="33" fill="#17191c" font-weight="600">提供方说什么</text><text x="60" y="254" font-size="26" fill="#17191c" font-weight="500">Provider statements</text><text x="60" y="320" font-size="31" fill="#2455ef" font-weight="600">说明 · 条款 · 范围</text><rect x="470" y="145" width="395" height="275" rx="12" fill="#2455ef"/><text x="495" y="210" font-size="33" fill="#fff" font-weight="600">实际知道什么</text><text x="495" y="254" font-size="26" fill="#fff" font-weight="500">What is established</text><text x="495" y="320" font-size="31" fill="#fff" font-weight="600">观察 · 来源 · 未知</text><text x="35" y="500" font-size="34" fill="#17191c" font-weight="600">可疑信号 ≠ 已证实指控</text><text x="35" y="543" font-size="27" fill="#17191c" font-weight="500">A concern is not a proven allegation.</text></svg>