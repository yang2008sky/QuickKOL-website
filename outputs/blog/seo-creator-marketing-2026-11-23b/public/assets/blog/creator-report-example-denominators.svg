<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="900" height="620" rx="0" fill="#f6f1e7"/><text x="36" y="60" font-size="36" fill="#17191c" font-weight="600">同一互动数，不同分母</text><text x="36" y="104" font-size="27" fill="#17191c" font-weight="500">SAME ENGAGEMENTS, DIFFERENT DENOMINATORS</text><text x="35" y="180" font-size="66" fill="#2455ef" font-weight="600">200</text><text x="210" y="180" font-size="29" fill="#17191c" font-weight="600">假设互动 / Hypothetical engagements</text><rect x="35" y="225" width="395" height="250" rx="12" fill="#fff"/><text x="65" y="292" font-size="42" fill="#17191c" font-weight="600">200 ÷ 8,000</text><text x="65" y="352" font-size="29" fill="#17191c" font-weight="600">展示 / Impressions</text><text x="65" y="430" font-size="66" fill="#2455ef" font-weight="600">2.5%</text><rect x="470" y="225" width="395" height="250" rx="12" fill="#2455ef"/><text x="500" y="292" font-size="42" fill="#fff" font-weight="600">200 ÷ 5,000</text><text x="500" y="352" font-size="29" fill="#fff" font-weight="600">触达 / Reach</text><text x="500" y="430" font-size="66" fill="#fff" font-weight="600">4%</text><text x="35" y="552" font-size="31" fill="#17191c" font-weight="600">不可隐藏分母或把空值写成 0%。</text><text x="35" y="595" font-size="26" fill="#17191c" font-weight="500">Show the denominator. Missing is not zero.</text></svg>