<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="900" height="600" rx="0" fill="#f6f1e7"/><text x="36" y="60" font-size="36" fill="#17191c" font-weight="600">把空泛赞美改成有用说明</text><text x="36" y="104" font-size="27" fill="#17191c" font-weight="500">TURN VAGUE PRAISE INTO AN ANSWER</text><rect x="35" y="145" width="830" height="140" rx="12" fill="#fff"/><text x="60" y="199" font-size="33" fill="#17191c" font-weight="600">“好用！必备！”</text><text x="60" y="243" font-size="26" fill="#17191c" font-weight="500">Vague praise</text><rect x="35" y="330" width="830" height="200" rx="12" fill="#2455ef"/><text x="60" y="389" font-size="33" fill="#fff" font-weight="600">问题 → 演示 → 条件</text><text x="60" y="433" font-size="26" fill="#fff" font-weight="500">Question → Demonstration → Conditions</text><text x="60" y="487" font-size="34" fill="#fff" font-weight="600">租房玄关怎样放湿伞？</text></svg>