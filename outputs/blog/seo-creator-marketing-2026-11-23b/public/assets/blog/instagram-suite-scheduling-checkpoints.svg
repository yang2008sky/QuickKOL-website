<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650"><style>text{font-family:Arial,'PingFang SC','Noto Sans CJK SC',sans-serif}</style><rect x="0" y="0" width="900" height="650" rx="0" fill="#f6f1e7"/><text x="36" y="60" font-size="36" fill="#17191c" font-weight="600">排期与发布是不同状态</text><text x="36" y="104" font-size="27" fill="#17191c" font-weight="500">SCHEDULED AND PUBLISHED ARE DIFFERENT</text><rect x="35" y="155" width="240" height="170" rx="12" fill="#fff"/><text x="55" y="193" font-size="24" fill="#2455ef" font-weight="600">01</text><text x="55" y="254" font-size="33" fill="#17191c" font-weight="600">账号</text><text x="55" y="298" font-size="26" fill="#17191c" font-weight="500">Account</text><rect x="330" y="155" width="240" height="170" rx="12" fill="#fff"/><text x="350" y="193" font-size="24" fill="#2455ef" font-weight="600">02</text><text x="350" y="254" font-size="33" fill="#17191c" font-weight="600">目标</text><text x="350" y="298" font-size="26" fill="#17191c" font-weight="500">Destination</text><rect x="625" y="155" width="240" height="170" rx="12" fill="#fff"/><text x="645" y="193" font-size="24" fill="#2455ef" font-weight="600">03</text><text x="645" y="254" font-size="33" fill="#17191c" font-weight="600">素材</text><text x="645" y="298" font-size="26" fill="#17191c" font-weight="500">Asset</text><rect x="35" y="365" width="240" height="170" rx="12" fill="#fff"/><text x="55" y="403" font-size="24" fill="#2455ef" font-weight="600">04</text><text x="55" y="464" font-size="33" fill="#17191c" font-weight="600">时间</text><text x="55" y="508" font-size="26" fill="#17191c" font-weight="500">Time</text><rect x="330" y="365" width="240" height="170" rx="12" fill="#fff"/><text x="350" y="403" font-size="24" fill="#2455ef" font-weight="600">05</text><text x="350" y="464" font-size="33" fill="#17191c" font-weight="600">排期</text><text x="350" y="508" font-size="26" fill="#17191c" font-weight="500">Scheduled item</text><rect x="625" y="365" width="240" height="170" rx="12" fill="#2455ef"/><text x="645" y="403" font-size="24" fill="#fff" font-weight="600">06</text><text x="645" y="464" font-size="33" fill="#fff" font-weight="600">发布</text><text x="645" y="508" font-size="26" fill="#fff" font-weight="500">Published post</text><text x="35" y="614" font-size="31" fill="#17191c" font-weight="600">到时打开真实作品链接，再确认结果。</text></svg>